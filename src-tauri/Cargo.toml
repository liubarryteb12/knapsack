[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

# 局域网会话（阶段12）：临时 HTTP 服务 + 信封加密
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.15.0"
