>准备 4 周存稿</title><rect x="1004" y="138" width="136" height="34" rx="6" fill="#ffffff" stroke="#3964fe" stroke-width="1" stroke-opacity="0.55"/><rect x="1016.5" y="149.5" width="11" height="11" rx="3" fill="none" stroke="#6b7280"/><text x="1034" y="155" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">准备 4 周存稿</text></g><g><title>接 2 个定制单</title><rect x="364" y="34.5" width="118" height="34" rx="6" fill="rgba(240,140,0,0.1)" stroke="#f08c00" stroke-width="1.5" stroke-opacity="1"/><text x="376" y="51.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">接 2 个定制单</text></g><g><title>获客渠道</title><rect x="228" y="11.5" width="80" height="34" rx="6" fill="#ffffff" stroke="#f08c00" stroke-width="1" stroke-opacity="0.55"/><text x="240" y="28.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">获客渠道</text></g><g><title>列出 10 个潜在客户</title><rect x="0" y="11.5" width="172" height="34" rx="6" fill="#ffffff" stroke="#f08c00" stroke-width="1" stroke-opacity="0.55"/><rect x="12.5" y="23" width="11" height="11" rx="3" fill="none" stroke="#6b7280"/><text x="30" y="28.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">列出 10 个潜在客户</text></g><g><title>交付模板</title><rect x="228" y="57.5" width="80" height="34" rx="6" fill="#ffffff" stroke="#f08c00" stroke-width="1" stroke-opacity="0.55"/><text x="240" y="74.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">交付模板</text></g><g><title>写报价单模板</title><rect x="46" y="57.5" width="126" height="34" rx="6" fill="#ffffff" stroke="#f08c00" stroke-width="1" stroke-opacity="0.55"/><rect x="58.5" y="69" width="11" height="11" rx="3" fill="none" stroke="#6b7280"/><text x="76" y="74.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">写报价单模板</text></g><g><title>建立个人知识库</title><rect x="360" y="103.5" width="122" height="34" rx="6" fill="rgba(12,166,120,0.1)" stroke="#0ca678" stroke-width="1.5" stroke-opacity="1"/><text x="372" y="120.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">建立个人知识库</text></g><g><title>目录结构</title><rect x="224" y="103.5" width="80" height="34" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="1" stroke-opacity="0.55"/><text x="236" y="120.5" font-size="14" dominant-baseline="central" fill="#1f2937" xml:space="preserve">目录结构</text></g><g><title>画目录草图</title><rect x="56" y="103.5" width="112" height="34" rx="6" fill="#ffffff" stroke="#0ca678" stroke-width="1" stroke-opacity="0.55"/><rect x="68" y="114.5" width="12" height="12" rx="3" fill="#0ca678"/><path d="M70.5,120.7 L73,123.2 L77.5,118" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="120.5" font-size="14" dominant-baseline="central" fill="#6b7280" text-decoration="line-through" xml:space="preserve">画目录草图</text></g></g></svg>